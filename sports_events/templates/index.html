<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports Events — Register</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
<div class="bg-scene"><div class="track-lines"></div></div>

<section class="screen active" id="s1">
  <div class="card">
    <h1 class="title-orange">Sports Events</h1>
    <p class="subtitle">Register for upcoming events</p>

    <label for="fullname">Full Name</label>
    <input type="text" id="fullname" placeholder="Enter your name">
    <span class="field-error" id="err-name"></span>

    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="Enter your email">
    <span class="field-error" id="err-email"></span>

    <button class="btn-primary" onclick="goToEvents()">Continue to Events &rarr;</button>
  </div>
</section>

<script src="../static/js/main.js"></script>
</body>
</html>
